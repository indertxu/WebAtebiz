<!-- =====================================================
     PLANTILLA EMAILJS — AVISO INTERNO (info@atebiz.com)
     Pegar este HTML en EmailJS → Templates → nueva plantilla
     Asunto sugerido: Nuevo mensaje de contacto — {{from_name}}
     "To Email": {{to_email}}
     "Reply To": {{reply_to}}
     ===================================================== -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="margin:0;padding:0;background:#020e07;font-family:'Inter',Arial,sans-serif;color:#e5f5ec;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#020e07;padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#0a1a12;border:1px solid #1a3d2b;border-radius:20px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:32px 40px 20px 40px;border-bottom:1px solid #1a3d2b;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.15em;color:#00ff85;text-transform:uppercase;">NUEVO CONTACTO</div>
                    <div style="font-size:22px;font-weight:700;color:#ffffff;margin-top:6px;">Mensaje recibido en atebiz.com</div>
                  </td>
                  <td align="right" style="vertical-align:top;">
                    <div style="display:inline-block;background:#00ff85;color:#020e07;font-weight:700;font-size:18px;padding:10px 14px;border-radius:10px;">A</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Datos del contacto -->
          <tr>
            <td style="padding:28px 40px 8px 40px;">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;color:#00ff85;text-transform:uppercase;margin-bottom:12px;">DATOS DEL CONTACTO</div>
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#0d2419;border:1px solid #1a3d2b;border-radius:14px;">
                <tr>
                  <td style="padding:16px 20px;border-bottom:1px solid #1a3d2b;">
                    <div style="font-size:11px;color:#7fa895;margin-bottom:4px;">Nombre</div>
                    <div style="font-size:15px;color:#ffffff;font-weight:600;">{{from_name}}</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:16px 20px;border-bottom:1px solid #1a3d2b;">
                    <div style="font-size:11px;color:#7fa895;margin-bottom:4px;">Email</div>
                    <div style="font-size:15px;color:#00ff85;font-weight:600;"><a href="mailto:{{from_email}}" style="color:#00ff85;text-decoration:none;">{{from_email}}</a></div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:16px 20px;">
                    <div style="font-size:11px;color:#7fa895;margin-bottom:4px;">Fecha</div>
                    <div style="font-size:15px;color:#ffffff;">{{fecha}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Mensaje -->
          <tr>
            <td style="padding:24px 40px 8px 40px;">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;color:#00ff85;text-transform:uppercase;margin-bottom:12px;">MENSAJE</div>
              <div style="background:#0d2419;border:1px solid #1a3d2b;border-left:3px solid #00ff85;border-radius:14px;padding:18px 22px;font-size:15px;line-height:1.6;color:#e5f5ec;white-space:pre-wrap;">{{message}}</div>
            </td>
          </tr>

          <!-- CTA responder -->
          <tr>
            <td style="padding:28px 40px;">
              <a href="mailto:{{from_email}}" style="display:inline-block;background:#00ff85;color:#020e07;font-weight:600;padding:14px 28px;border-radius:999px;text-decoration:none;font-size:14px;">Responder a {{from_name}} →</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px 32px 40px;border-top:1px solid #1a3d2b;">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#5a7d6b;">
                ATEBIZ · SISTEMA DE CONTACTO · atebiz.com
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
